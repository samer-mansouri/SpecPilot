[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "specpilot"
version = "1.0.2"
description = "Agentic interactive CLI for OpenAPI-driven API automation"




readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "SpecPilot Contributors" }
]
dependencies = [
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
    "httpx>=0.25.0",
    "click>=8.0.0",
    "rich>=13.0.0",
    "mcp>=1.0.0",
    "prompt-toolkit>=3.0.0",
    "langgraph>=0.2.0",
    "langchain-core>=0.3.0",
    "jsonschema>=4.0.0",
]


[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "respx>=0.21.0",
]

[project.scripts]
specpilot = "specpilot.cli:cli"

[tool.hatch.build.targets.wheel]
packages = ["src/specpilot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
