openapi: "3.0.3"
info:
  title: "Petstore YAML API"
  version: "1.0.0"
  description: "YAML sample specification for testing SpecPilot."
servers:
  - url: "https://api.petstore.example.com/v1"
paths:
  /pets:
    get:
      summary: "List all pets"
      operationId: "listPets"
      tags:
        - "pets"
      responses:
        "200":
          description: "A paged array of pets"
